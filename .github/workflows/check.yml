name: Check Docker Builds

on:
  pull_request:
    branches: [latest]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # ── Phase 1: Build base image ──────────────────────────────────────────

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: false
          tags: devcontainer-base:latest

      # ── Phase 2: Build language images (no push) ──────────────────────────

      - name: Build trixie-bun-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-bun-nvm-uv-claude/Dockerfile
          push: false

      - name: Build trixie-php-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-php-nvm-uv-claude/Dockerfile
          push: false

      - name: Build trixie-rust-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-rust-nvm-uv-claude/Dockerfile
          push: false

      - name: Build trixie-vnc-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-vnc-nvm-uv-claude/Dockerfile
          push: false
