name: Check Docker Builds

on:
  pull_request:
    branches: [latest]
    paths:
      - 'base/**'
      - 'trixie-*/Dockerfile'
      - 'scripts/*.sh'

jobs:
  # ── Phase 1: Build base image (restore from GHA cache) ─────────────────────
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: devcontainer-base${{ matrix.suffix }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - install_docker: true
            suffix: ""
            scope: base
          - install_docker: false
            suffix: "-nodocker"
            scope: base-nodocker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: false
          load: true
          tags: devcontainer-base:latest
          build-args: |
            INSTALL_DOCKER=${{ matrix.install_docker }}
          cache-from: type=gha,scope=${{ matrix.scope }}

      - name: Verify base tools
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scripts/verify-tools.sh:/tmp/verify-tools.sh:ro" \
            devcontainer-base:latest \
            bash /tmp/verify-tools.sh base 2>&1 | tee /tmp/verify-output.txt

      - name: Comment PR with base verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "ALL_CHECKS_PASSED" /tmp/verify-output.txt 2>/dev/null; then
            ICON="✅"
          else
            ICON="❌"
          fi
          {
            echo "### ${ICON} Tool Verification: base${{ matrix.suffix }}"
            echo ""
            echo "<details>"
            echo "<summary>Click to expand verification output</summary>"
            echo ""
            echo '```'
            cat /tmp/verify-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/comment-body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment-body.md

  # ── Phase 2: Build language images in parallel (no push) ───────────────────
  variants:
    needs: base
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}${{ matrix.suffix }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trixie-bun-nvm-uv-claude
            scope: bun
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-bun-nvm-uv-claude
            scope: bun-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-php-nvm-uv-claude
            scope: php
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-php-nvm-uv-claude
            scope: php-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-rust-nvm-uv-claude
            scope: rust
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-rust-nvm-uv-claude
            scope: rust-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-vnc-nvm-uv-claude
            scope: vnc
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-vnc-nvm-uv-claude
            scope: vnc-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-vnc-flutter-rust-nvm-uv-claude
            scope: flutter
            base_scope: base
            install_docker: true
            suffix: ""
            needs_vnc: true
            vnc_scope: vnc
            build_contexts: trixie-vnc-nvm-uv-claude:latest=docker-image://localhost:5000/trixie-vnc-nvm-uv-claude:latest
          - name: trixie-vnc-flutter-rust-nvm-uv-claude
            scope: flutter-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            needs_vnc: true
            vnc_scope: vnc-nodocker
            build_contexts: trixie-vnc-nvm-uv-claude:latest=docker-image://localhost:5000/trixie-vnc-nvm-uv-claude:latest

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Rebuild base from cache and push to local registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: true
          tags: localhost:5000/devcontainer-base:latest
          build-args: |
            INSTALL_DOCKER=${{ matrix.install_docker }}
          cache-from: type=gha,scope=${{ matrix.base_scope }}

      - name: Rebuild VNC from cache and push to local registry
        if: matrix.needs_vnc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-vnc-nvm-uv-claude/Dockerfile
          push: true
          tags: localhost:5000/trixie-vnc-nvm-uv-claude:latest
          build-contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          build-args: |
            INSTALL_DOCKER=${{ matrix.install_docker }}
          cache-from: type=gha,scope=${{ matrix.vnc_scope }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.name }}:check
          build-contexts: ${{ matrix.build_contexts }}
          cache-from: type=gha,scope=${{ matrix.scope }}

      - name: Verify ${{ matrix.name }} tools
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scripts/verify-tools.sh:/tmp/verify-tools.sh:ro" \
            ${{ matrix.name }}:check \
            bash /tmp/verify-tools.sh ${{ matrix.name }} 2>&1 | tee /tmp/verify-output.txt

      - name: Comment PR with ${{ matrix.name }} verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VARIANT="${{ matrix.name }}${{ matrix.suffix }}"
          if grep -q "ALL_CHECKS_PASSED" /tmp/verify-output.txt 2>/dev/null; then
            ICON="✅"
          else
            ICON="❌"
          fi
          {
            echo "### ${ICON} Tool Verification: ${VARIANT}"
            echo ""
            echo "<details>"
            echo "<summary>Click to expand verification output</summary>"
            echo ""
            echo '```'
            cat /tmp/verify-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/comment-body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment-body.md
