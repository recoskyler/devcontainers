name: Build and Push Docker Images

on:
  push:
    branches: [latest]
    tags: ["v*"]
    paths:
      - 'base/**'
      - 'trixie-*/Dockerfile'
      - 'scripts/*.sh'

env:
  REGISTRY: ghcr.io

jobs:
  # ── Phase 1: Build base image + populate GHA cache ──────────────────────────
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: devcontainer-base${{ matrix.suffix }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - install_docker: true
            suffix: ""
            scope: base
          - install_docker: false
            suffix: "-nodocker"
            scope: base-nodocker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (base)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainer-base
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_DOCKER=${{ matrix.install_docker }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  # ── Phase 2: Build and push language images (parallel) ──────────────────────
  variants:
    needs: base
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}${{ matrix.suffix }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trixie-bun-nvm-uv-claude
            scope: bun
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-bun-nvm-uv-claude
            scope: bun-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-php-nvm-uv-claude
            scope: php
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-php-nvm-uv-claude
            scope: php-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-rust-nvm-uv-claude
            scope: rust
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-rust-nvm-uv-claude
            scope: rust-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-vnc-nvm-uv-claude
            scope: vnc
            base_scope: base
            install_docker: true
            suffix: ""
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-vnc-nvm-uv-claude
            scope: vnc-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            build_contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          - name: trixie-vnc-flutter-rust-nvm-uv-claude
            scope: flutter
            base_scope: base
            install_docker: true
            suffix: ""
            needs_vnc: true
            vnc_scope: vnc
            build_contexts: trixie-vnc-nvm-uv-claude:latest=docker-image://localhost:5000/trixie-vnc-nvm-uv-claude:latest
          - name: trixie-vnc-flutter-rust-nvm-uv-claude
            scope: flutter-nodocker
            base_scope: base-nodocker
            install_docker: false
            suffix: "-nodocker"
            needs_vnc: true
            vnc_scope: vnc-nodocker
            build_contexts: trixie-vnc-nvm-uv-claude:latest=docker-image://localhost:5000/trixie-vnc-nvm-uv-claude:latest

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /opt/hostedtoolcache
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild base from cache and push to local registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: true
          tags: localhost:5000/devcontainer-base:latest
          build-args: |
            INSTALL_DOCKER=${{ matrix.install_docker }}
          cache-from: type=gha,scope=${{ matrix.base_scope }}

      - name: Rebuild VNC from cache and push to local registry
        if: matrix.needs_vnc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-vnc-nvm-uv-claude/Dockerfile
          push: true
          tags: localhost:5000/trixie-vnc-nvm-uv-claude:latest
          build-contexts: devcontainer-base:latest=docker-image://localhost:5000/devcontainer-base:latest
          build-args: |
            INSTALL_DOCKER=${{ matrix.install_docker }}
          cache-from: type=gha,scope=${{ matrix.vnc_scope }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: ${{ matrix.build_contexts }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
