name: Build and Push Docker Images

on:
  push:
    branches: [latest]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Phase 1: Build base image (local only) ─────────────────────────────

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: false
          tags: devcontainer-base:latest

      # ── Phase 2: Build and push language images ─────────────────────────────

      # -- trixie-bun-nvm-uv-claude --

      - name: Extract metadata (trixie-bun-nvm-uv-claude)
        id: meta-bun
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trixie-bun-nvm-uv-claude
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push trixie-bun-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-bun-nvm-uv-claude/Dockerfile
          push: true
          tags: ${{ steps.meta-bun.outputs.tags }}
          labels: ${{ steps.meta-bun.outputs.labels }}

      # -- trixie-php-nvm-uv-claude --

      - name: Extract metadata (trixie-php-nvm-uv-claude)
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trixie-php-nvm-uv-claude
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push trixie-php-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-php-nvm-uv-claude/Dockerfile
          push: true
          tags: ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}

      # -- trixie-rust-nvm-uv-claude --

      - name: Extract metadata (trixie-rust-nvm-uv-claude)
        id: meta-rust
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trixie-rust-nvm-uv-claude
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push trixie-rust-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-rust-nvm-uv-claude/Dockerfile
          push: true
          tags: ${{ steps.meta-rust.outputs.tags }}
          labels: ${{ steps.meta-rust.outputs.labels }}

      # -- trixie-vnc-nvm-uv-claude --

      - name: Extract metadata (trixie-vnc-nvm-uv-claude)
        id: meta-vnc
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trixie-vnc-nvm-uv-claude
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push trixie-vnc-nvm-uv-claude
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trixie-vnc-nvm-uv-claude/Dockerfile
          push: true
          tags: ${{ steps.meta-vnc.outputs.tags }}
          labels: ${{ steps.meta-vnc.outputs.labels }}
