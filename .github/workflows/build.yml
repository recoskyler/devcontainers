name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trixie-bun-nvm-uv-claude
            dockerfile: templates/bun.Dockerfile
            variant: debian
          - name: trixie-slim-bun-nvm-uv-claude
            dockerfile: templates/bun.Dockerfile
            variant: debian-slim
          - name: trixie-php-nvm-uv-claude
            dockerfile: templates/php.Dockerfile
            variant: "8.3-trixie"
          - name: trixie-slim-php-nvm-uv-claude
            dockerfile: templates/php.Dockerfile
            variant: "8.3-trixie-slim"
          - name: noble-uv-vnc-claude
            dockerfile: noble-uv-vnc-claude/Dockerfile
            variant: noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            CONTEXT7_API_KEY=${{ secrets.CONTEXT7_API_KEY }}
            AUTOMEM_ENDPOINT=${{ secrets.AUTOMEM_ENDPOINT }}
            AUTOMEM_API_KEY=${{ secrets.AUTOMEM_API_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
